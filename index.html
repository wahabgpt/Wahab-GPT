<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WahabGPT — Personal AI</title>

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-book-open"></i>
            </div>

            <div>
                <h1>WahabGPT</h1>
                <span>Personal AI Khata</span>
            </div>

        </div>


        <button class="new-chat" id="newChatBtn">
            <i class="fa-solid fa-plus"></i>
            New Chat
        </button>


        <div class="sidebar-section">

            <div class="section-title">
                <i class="fa-solid fa-book"></i>
                AI MENU
            </div>

            <button class="menu-item" data-prompt="Tell me about myself">
                <i class="fa-solid fa-user"></i>
                About Me
            </button>

            <button class="menu-item" data-prompt="Tell me about my projects">
                <i class="fa-solid fa-folder-open"></i>
                My Projects
            </button>

            <button class="menu-item" data-prompt="What are my coding skills?">
                <i class="fa-solid fa-code"></i>
                My Skills
            </button>

            <button class="menu-item" data-prompt="What are my learning goals?">
                <i class="fa-solid fa-graduation-cap"></i>
                Learning
            </button>

        </div>


        <div class="sidebar-section recent-section">

            <div class="section-title">
                <i class="fa-solid fa-clock-rotate-left"></i>
                RECENT CHATS
            </div>

            <div class="recent-chat">
                <i class="fa-regular fa-message"></i>
                <span>Current Chat</span>
            </div>

        </div>


        <div class="sidebar-footer">

            <div class="local-status">

                <span class="status-dot"></span>

                <div>
                    <strong>Local AI</strong>
                    <small>Ollama Connected</small>
                </div>

            </div>

            <div class="powered">
                WahabGPT • Local
            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="topbar">

            <button id="mobileMenu" class="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="page-title">

                <div class="title-icon">
                    <i class="fa-solid fa-book-open"></i>
                </div>

                <div>
                    <h2>WahabGPT</h2>
                    <span>Digital AI Khata</span>
                </div>

            </div>


            <div class="connection">

                <span class="status-dot"></span>

                <span>Local</span>

            </div>

        </header>


        <!-- CHAT -->
        <section class="chat-area">

            <!-- WELCOME -->
            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    <i class="fa-solid fa-robot"></i>
                </div>

                <h2>Assalam-o-Alaikum, Wahab 👋</h2>

                <p>
                    Main <strong>WahabGPT</strong> hoon —
                    tumhara personal local AI assistant.
                </p>

                <div class="welcome-line"></div>

                <div class="quick-actions">

                    <button data-prompt="Tell me about myself">
                        <i class="fa-solid fa-user"></i>
                        About Me
                    </button>

                    <button data-prompt="Tell me about my projects">
                        <i class="fa-solid fa-folder"></i>
                        My Projects
                    </button>

                    <button data-prompt="Help me with coding">
                        <i class="fa-solid fa-code"></i>
                        Coding Help
                    </button>

                    <button data-prompt="What can you help me with?">
                        <i class="fa-solid fa-lightbulb"></i>
                        What Can You Do?
                    </button>

                </div>

            </div>


            <!-- MESSAGES -->
            <div id="messages" class="messages"></div>

        </section>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-paper">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Apna message likhein..."
                    autocomplete="off"
                ></textarea>


                <button
                    id="sendButton"
                    class="send-button"
                    title="Send"
                >
                    <i class="fa-solid fa-arrow-up"></i>
                </button>

            </div>

            <div class="input-hint">
                <span>
                    <i class="fa-solid fa-keyboard"></i>
                    Enter to send
                </span>

                <span>
                    <i class="fa-solid fa-lock"></i>
                    Local Ollama AI
                </span>
            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
